<!DOCTYPE html>
<html>
<head>
  <title>Simple To-Do List</title>
</head>
<body>
  <h2>My To-Do List✅</h2>
  <hr>
    <input id="taskInput" type="text" placeholder="Enter a new task" list="taskOptions">
   <datalist id="taskOptions">
    <option value="Gym">
    <option value="Work">
    <option value="Shopping">
    <option value="Study">
    <option value="Football">
  </datalist>

  <button onclick="addTask()">Add Task</button>

  <ul id="taskList"></ul>

  <script src="script.js"></script>
</body>
</html>
